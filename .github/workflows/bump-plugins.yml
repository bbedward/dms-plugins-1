name: Periodic Plugin Version Bump

on:
  schedule:
    # Run at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump versions
        id: run_bump
        run: |
          python3 .github/bump_plugins.py
          if [ -f .bump-summary.txt ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.run_bump.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -a -m "chore(release): bump plugin versions" -m "$(cat .bump-summary.txt)"
          rm -f .bump-summary.txt
          git pull --rebase origin main
          git push origin main

      - name: Create GitHub Release
        if: steps.run_bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          TAG="v$(date -u +'%Y.%m.%d')"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="${TAG}.${{ github.run_number }}"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .bump-release-notes.md
          rm -f .bump-release-notes.md
